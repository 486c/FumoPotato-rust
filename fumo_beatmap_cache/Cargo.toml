[package]
name = "fumo_beatmap_cache"
edition = "2024"
version.workspace = true

[lib]
crate-type = ["lib"]
name = "fumo_beatmap_cache"
path = "src/lib.rs"

[dependencies]
sqlx = { version = "0.9.0", features = [ "tls-rustls" , "postgres", "chrono", "runtime-tokio", "sqlx-toml" ] }
osu_api = { workspace = true }
eyre = "0.6.12"
tracing = { workspace = true }
metrics = { workspace = true }
