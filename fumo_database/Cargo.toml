[package]
name = "fumo_database"
version = { workspace = true }
edition = "2021"

[lib]
crate-type = ["lib"]
name = "fumo_database"
path = "src/lib.rs"

[dependencies]
osu_api = { workspace = true }
chrono = "0.4.38"
eyre = "0.6.12"
#sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls" , "postgres", "chrono"], default-features = false }
sqlx = { version = "0.9.0", features = [ "tls-rustls" , "postgres", "chrono", "runtime-tokio", "sqlx-toml" ] }
